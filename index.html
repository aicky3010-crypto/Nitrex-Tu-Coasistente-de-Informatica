<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitrex - Tu Coasistente de Informática</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="diseño.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-aqua -900 text-gray-100 h-screen flex overflow-hidden">

<!-- Sidebar -->
<aside class="w-64 bg-gray-800 border-r border-gray-700 hidden md:flex flex-col">
  <div class="p-4 border-b border-gray-700">
    <button id="btnNuevaConsulta" class="w-full bg-gray-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg transition">
      <i class="fas fa-plus mr-2"></i> Nueva Consulta
    </button>
  </div>
  <nav class="flex-1 overflow-y-auto p-2 space-y-2" id="nav-history">
    <!-- Botones de historial -->
  </nav>
</aside>

<!-- Main -->
<main class="flex-1 flex flex-col relative">
  <header class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-900/50 backdrop-blur">
    <h1 class="text-xl font-bold text-black-400">Nitrex <span class="text-xs font-black text-black-400">v1.0</span></h1>
    <div class="flex gap-4">
      <i class="fas fa-cog text-gray-400 cursor-pointer hover:text-white"></i>
      <i class="fas fa-user-circle text-gray-400 cursor-pointer hover:text-white"></i>
    </div>
  </header>

  <!-- Chat -->
  <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
    <div class="flex gap-4 max-w-4xl mx-auto">
      <div class="w-8 h-8 rounded bg-white flex items-center justify-center shrink-0">
        <i class="fas fa-robot text-sm"></i>
      </div>
      <div class="message-container bot-message">
        <!-- 👇 AQUÍ CAMBIAS la imagen del BOT inicial -->
        <img src="muñeco.png" alt="Nitrex" class="bot-avatar">
        <!-- Ejemplo: img src="img/bot.png" -->
        <div class="message-text">¡Hola! Soy Nitrex, ¿En qué puedo ayudarte?</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="p-4 bg-write-900">
    <div class="max-w-4xl mx-auto relative">
      <textarea placeholder="Escribe tu mensaje..." class="w-full bg-gray-800 border border-gray-700 rounded-xl py-4 px-4 pr-12 focus:outline-none focus:border-blue-500" rows="1"></textarea>
      <button class="absolute right-3 top-3.5 text-blue-500 hover:text-blue-400">Enviar</button>
    </div>
  </footer>

<script>
const textarea = document.querySelector('textarea');
const chatContainer = document.getElementById('chat-container');
const sendButton = document.querySelector('button');
const btnNuevaConsulta = document.getElementById("btnNuevaConsulta");
const navHistory = document.getElementById("nav-history");

// Array para guardar el historial de preguntas
let historial = [];

// Función que genera la respuesta del bot
function generateBotResponse(message) {
  const msgLower = message.toLowerCase();

  if (msgLower.includes('hola')) return '¡Hola! Encantado de saludarte. Puedes preguntarme sobre HTML, CSS, JavaScript, Java, Python.';
  if (msgLower.includes('javascript') || msgLower === 'js') return 'JavaScript es un lenguaje de programación muy versátil usado principalmente en la web.';
  if (msgLower.includes('java')) return 'Java es un lenguaje orientado a objetos usado en aplicaciones empresariales y móviles.';
  if (msgLower.includes('html')) return 'HTML es el lenguaje de marcado que estructura el contenido de las páginas web.';
  if (msgLower.includes('css')) return 'CSS se usa para dar estilo a las páginas web: colores, tipografías y diseño responsive.';
  if (msgLower.includes('python')) return 'Python es fácil de aprender y potente, usado en web, ciencia de datos e IA.';
  if (msgLower.includes('variable')) return 'Una variable en programación es un espacio en memoria que se utiliza para almacenar datos que pueden ser recuperados y manipulados durante la ejecución de un programa. Estas permiten guardar valores, asignarlos a otras variables, utilizarlos en expresiones matemáticas o mostrarlos en pantalla.';
  if (msgLower.includes('elementos')) return 'HTML tiene aproximadamente 117 elementos que se utilizan para estructurar el contenido de una página web. Algunos de los elementos más comunes incluyen: div, span, p, a, img, ul, li, table, entre otros. Cada elemento tiene una función específica y se utiliza para organizar y presentar la información de manera efectiva en la web.';
  if (msgLower.includes('gracias')) return '¡De nada! Estoy aquí para ayudarte con cualquier pregunta de programación.';
  return `No estoy seguro de eso, pero puedo intentar explicarlo: "${message}".`;
}

// Función para mostrar mensaje en el chat
function mostrarMensaje(usuario, mensaje) {
  const wrapper = document.createElement('div');
  wrapper.className = 'message-wrapper ' + (usuario ? 'user-message' : 'bot-message');
  wrapper.innerHTML = `
    <!-- 👇 AQUÍ CAMBIAS las imágenes dinámicas -->
    <img src="${usuario ? 'user.png' : 'muñeco.png'}" 
    alt="${usuario ? 'Usuario' : 'Bot'}" 
    class="${usuario ? 'user-avatar' : 'bot'}">
    
    <!-- Ejemplo:
    usuario: img/user.png
    bot: img/bot.png
    -->

    <div class="message-text">${mensaje}</div>
  `;
  chatContainer.appendChild(wrapper);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

// Función para agregar a historial y navegación lateral
function agregarHistorial(pregunta) {
  historial.push(pregunta);

  const btn = document.createElement('button');
  btn.className = 'p-2 hover:bg-gray-700 rounded w-full text-left cursor-pointer text-sm';
  btn.textContent = pregunta;
  btn.addEventListener('click', () => {
    // Mostrar pregunta y respuesta en el chat
    mostrarMensaje(true, pregunta);
    mostrarMensaje(false, generateBotResponse(pregunta));
  });

  navHistory.appendChild(btn);
}

// Función para enviar mensaje
function sendMessage() {
  const mensaje = textarea.value.trim();
  if (!mensaje) return;

  mostrarMensaje(true, mensaje);
  mostrarMensaje(false, generateBotResponse(mensaje));

  agregarHistorial(mensaje); // Agrega al historial y navegación lateral
  textarea.value = '';
}

// Enter envía mensaje
textarea.addEventListener('keydown', e => {
  if(e.key === 'Enter') { e.preventDefault(); sendMessage(); }
});

// Botón enviar
sendButton.addEventListener('click', sendMessage);
sendButton.addEventListener('enter', sendMessage);

// Botón nueva consulta
btnNuevaConsulta.addEventListener("click", () => {
  chatContainer.innerHTML = `
    <div class="flex gap-4 max-w-4xl mx-auto">
      <div class="w-8 h-8 rounded bg-gray-500 flex items-center justify-center shrink-0">
        <i class="fas fa-robot text-sm"></i>
      </div>
      <div class="message-container bot-message">
        <!-- 👇 TAMBIÉN AQUÍ CAMBIAS la imagen del BOT -->
        <img src="muñeco.png" alt="Nitrex" class="bot-avatar" />
        <div class="message-text">¡Hola! Soy Nitrex, ¿En qué puedo ayudarte?</div>
      </div>
    </div>
  `;
  textarea.value = "";
  textarea.focus();
});

</script>
</body>
</html>
